<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shahad</title>
<meta name="description" content="Shahad — cybersecurity specialist, software developer, philosophical writer and author.">
<meta name="theme-color" content="#050507">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050507'/%3E%3Cpath d='M32 8l5 19 19 5-19 5-5 19-5-19-19-5 19-5z' fill='%23ece9e2'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--ink:#ece9e2;--dim:#a19d95;--acc:#d8d5ce;--line:rgba(236,233,226,.26)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100svh;padding:16px 14px 44px;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.05rem;line-height:1.6;overflow-x:hidden;
  background:radial-gradient(900px 500px at 50% 112%,#25252c 0,transparent 70%),radial-gradient(700px 400px at 50% -10%,#16161c 0,transparent 70%),var(--bg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#glow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* the page: a pointed-arch window */
.page{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:80px 18px 34px;text-align:center;
  background:rgba(8,8,11,.58);border:1px solid var(--line);border-radius:220px 220px 10px 10px/150px 150px 10px 10px;
  box-shadow:0 24px 60px -34px rgba(255,255,255,.14);animation:in 1.6s ease both}
.page::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:inherit;pointer-events:none}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.star{display:inline-block;color:#e9e9ee;font-size:1.2rem;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25) rotate(20deg);opacity:.55}}
h1{font-family:'UnifrakturCook','Cormorant Garamond',serif;font-size:clamp(3.2rem,16vw,4.4rem);font-weight:700;line-height:1.1}
.line{font-style:italic;font-size:1.25rem;color:var(--dim);margin:2px 0 10px}
.bio{max-width:400px;margin:0 auto;font-size:1.02rem;color:var(--dim)}
.orn{display:flex;align-items:center;gap:12px;margin:22px 8px 16px;color:var(--acc)}
.orn::before,.orn::after{content:"";flex:1;border-top:1px solid var(--line)}
h2{font-family:'Cinzel',serif;font-weight:400;font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--acc);margin-bottom:16px}

/* portraits in arched frames */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px;padding:0 6px}
.tile{background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:center}
.arch{position:relative;display:block;aspect-ratio:3/4;border-radius:999px 999px 4px 4px;overflow:hidden;background:#17171c;
  box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line);transition:box-shadow .5s}
.arch img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block;transition:transform .9s}
.tile:hover .arch,.tile:focus-visible .arch{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--acc),0 14px 34px -10px rgba(255,255,255,.4)}
.tile:hover img{transform:scale(1.07)}
.noimg::after{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font-family:'UnifrakturCook',serif;font-size:2.4rem;color:var(--dim)}
.nm{display:block;margin-top:12px;font-family:'Cinzel',serif;font-weight:600;font-size:.62rem;letter-spacing:.06em;line-height:1.4;text-transform:uppercase}
.w{display:block;font-style:italic;font-size:.88rem;color:var(--dim);line-height:1.25}

.tg{display:inline-block;margin-top:2px;padding:9px 26px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;
  font-family:'Cinzel',serif;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;transition:.4s}
.tg:hover{background:var(--ink);color:var(--bg)}

/* enlarged portrait */
#lb{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:rgba(5,5,7,.96);text-align:center;cursor:zoom-out}
#lb.on{display:flex;animation:fade .5s}
@keyframes fade{from{opacity:0}}
#lb .arch{width:min(74vw,320px);cursor:default}
#lb .nm{font-size:.95rem;margin-top:18px}
#lb .w{font-size:1.05rem}

@media(prefers-reduced-motion:reduce){.page,.star,#lb.on{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<canvas id="glow" aria-hidden="true"></canvas>

<main class="page">
  <div class="star">✦</div>
  <h1>Shahad</h1>
  <p class="line">𝘮𝘢𝘥𝘦 𝘰𝘧 𝘴𝘪𝘭𝘦𝘯𝘤𝘦 𝘢𝘯𝘥 𝘥𝘳𝘦𝘢𝘮𝘴</p>
  <p class="bio">Cybersecurity specialist, software developer, philosophical writer and author, reader, interested in psychology and astronomy</p>

  <div class="orn"><span>❦</span></div>
  <h2>Games</h2>
  <div class="grid" id="games"></div>

  <div class="orn"><span>❦</span></div>
  <h2>Characters</h2>
  <div class="grid" id="chars"></div>

  <div class="orn"><span>❦</span></div>
  <a class="tg" href="https://t.me/thesingularstar" target="_blank" rel="noopener noreferrer">My Telegram channel ↗</a>
</main>

<div id="lb" role="dialog" aria-modal="true" aria-label="Portrait">
  <span class="arch"><img alt=""></span>
  <b class="nm"></b><span class="w"></span>
</div>

<script>
/* ===== Edit here: add or change names and image files ===== */
const GAMES = [
  { name: "Bloodborne",          img: "IMG_2228.jpeg" },
  { name: "Red Dead Redemption", img: "IMG_2226.jpeg" },
  { name: "Silent Hill",         img: "IMG_2227.jpeg" }
];
const CHARACTERS = [
  { name: "Maki Zenin",              work: "Jujutsu Kaisen",     img: "IMG_2216.jpeg" },
  { name: "Mikasa Ackerman",         work: "Attack on Titan",    img: "IMG_2219.jpeg" },
  { name: "Levi Ackerman",           work: "Attack on Titan",    img: "IMG_2218.jpeg" },
  { name: "Johan Liebert",           work: "Monster",            img: "IMG_2215.jpeg" },
  { name: "Sherlock Holmes",         work: "Sherlock Holmes",    img: "IMG_2221.jpeg" },
  { name: "William James Moriarty",  work: "Moriarty the Patriot", img: "IMG_2222.jpeg" },
  { name: "L",                       work: "Death Note",         img: "IMG_2223.jpeg" },
  { name: "Naomi Misora",            work: "Death Note",         img: "IMG_2224.jpeg" },
  { name: "Re-l Mayer",              work: "Ergo Proxy",         img: "IMG_2225.jpeg" }
];
/* ========================================================== */

const lb = document.getElementById('lb'), lbImg = lb.querySelector('img'),
      lbName = lb.querySelector('.nm'), lbWork = lb.querySelector('.w');
function show(o, src){
  if(!src) return;
  lbImg.src = src; lbImg.alt = o.name; lbName.textContent = o.name; lbWork.textContent = o.work || '';
  lb.classList.add('on');
}
lb.addEventListener('click', () => lb.classList.remove('on'));
addEventListener('keydown', e => { if(e.key === 'Escape') lb.classList.remove('on'); });

function tile(o){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'tile';
  const a = document.createElement('span'); a.className = 'arch'; a.dataset.l = o.name[0];
  const im = document.createElement('img'); im.alt = o.name; im.loading = 'lazy'; im.src = o.img;
  im.onerror = () => { a.classList.add('noimg'); im.remove(); };
  a.append(im);
  const n = document.createElement('b'); n.className = 'nm'; n.textContent = o.name;
  b.append(a, n);
  if(o.work){ const w = document.createElement('span'); w.className = 'w'; w.textContent = o.work; b.append(w); }
  b.addEventListener('click', () => show(o, im.isConnected ? im.src : ''));
  return b;
}
GAMES.forEach(o => document.getElementById('games').append(tile(o)));
CHARACTERS.forEach(o => document.getElementById('chars').append(tile(o)));

/* ===== gothic candles: black & white wax, white flames, silver glints ===== */
(function(){
  const c = document.getElementById('glow'), x = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, candles = [], motes = [], run = true;

  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr;
    const n = innerWidth < 600 ? 5 : 7;
    candles = Array.from({length:n}, (_, i) => {
      const w = (14 + Math.random() * 7) * dpr;
      return {
        x: W * (.08 + .84 * i / (n - 1)) + (Math.random() - .5) * .03 * W,
        h: (80 + Math.random() * 100) * dpr, w, ph: Math.random() * 6.28, white: i % 2 === 0,
        drips: Array.from({length:3}, () => ({dx:(Math.random() - .5) * .6, len:(8 + Math.random() * 26) * dpr, dw:(2 + Math.random() * 2) * dpr}))
      };
    });
    motes = Array.from({length: innerWidth < 600 ? 14 : 24}, () => ({
      x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.3 + .5) * dpr,
      v: (Math.random() * .25 + .08) * dpr, p: Math.random() * 6.28
    }));
    if(reduce) draw(0);
  }

  function candle(k, t){
    const bx = k.x - k.w / 2, top = H - k.h, wax = k.white ? '#fffdf8' : '#2e2e35';
    const g = x.createLinearGradient(bx, 0, bx + k.w, 0);
    if(k.white){ g.addColorStop(0, '#85837e'); g.addColorStop(.35, '#f6f3ec'); g.addColorStop(1, '#75736e'); }
    else { g.addColorStop(0, '#0b0b0d'); g.addColorStop(.3, '#3c3c44'); g.addColorStop(1, '#08080a'); }
    x.globalAlpha = .96; x.fillStyle = g; x.fillRect(bx, top, k.w, k.h);
    x.strokeStyle = 'rgba(225,225,232,.4)'; x.lineWidth = dpr; x.strokeRect(bx, top, k.w, k.h);
    x.fillStyle = wax;
    for(const d of k.drips){
      const dx = k.x + d.dx * k.w;
      x.fillRect(dx - d.dw / 2, top, d.dw, d.len); x.beginPath(); x.arc(dx, top + d.len, d.dw / 2, 0, 6.283); x.fill();
    }
    x.beginPath(); x.ellipse(k.x, top, k.w / 2, k.w * .16, 0, 0, 6.283); x.fill(); x.stroke();

    /* gothic holder: pointed dish */
    const hw = k.w * .95, hh = 12 * dpr;
    x.fillStyle = '#0a0a0c'; x.strokeStyle = 'rgba(225,225,232,.55)';
    x.beginPath(); x.moveTo(k.x - hw, H); x.lineTo(k.x - hw * .7, H - hh); x.lineTo(k.x - hw * .35, H - hh * 1.6);
    x.lineTo(k.x + hw * .35, H - hh * 1.6); x.lineTo(k.x + hw * .7, H - hh); x.lineTo(k.x + hw, H); x.closePath(); x.fill(); x.stroke();

    const fy = top - 7 * dpr;
    x.strokeStyle = '#d9d6cf'; x.lineWidth = 1.2 * dpr; x.beginPath(); x.moveTo(k.x, top); x.lineTo(k.x + .5 * dpr, fy); x.stroke();

    const fl = 1 + .12 * Math.sin(t * .011 + k.ph) + .08 * Math.sin(t * .027 + k.ph * 2) + (reduce ? 0 : (Math.random() - .5) * .05);
    const sway = reduce ? 0 : Math.sin(t * .004 + k.ph) * 1.6 * dpr;
    const fh = 26 * dpr * fl, fw = 7.5 * dpr, cy = fy - fh * .4, R = 160 * dpr * (.9 + .1 * fl);

    const hg = x.createRadialGradient(k.x + sway, cy, 0, k.x + sway, cy, R);
    hg.addColorStop(0, 'rgba(238,242,255,' + (.36 * fl).toFixed(3) + ')');
    hg.addColorStop(.35, 'rgba(215,225,250,' + (.12 * fl).toFixed(3) + ')');
    hg.addColorStop(1, 'rgba(200,215,245,0)');
    x.globalAlpha = 1; x.fillStyle = hg; x.fillRect(k.x - R, cy - R, R * 2, R * 2);

    x.beginPath(); x.moveTo(k.x, fy);
    x.bezierCurveTo(k.x - fw, fy - fh * .3, k.x - fw * .6, fy - fh * .75, k.x + sway, fy - fh);
    x.bezierCurveTo(k.x + fw * .6 + sway * .3, fy - fh * .75, k.x + fw, fy - fh * .3, k.x, fy);
    const fg = x.createLinearGradient(0, fy, 0, fy - fh);
    fg.addColorStop(0, 'rgba(170,195,255,.9)'); fg.addColorStop(.4, 'rgba(255,255,255,.98)'); fg.addColorStop(1, 'rgba(236,242,255,.9)');
    x.fillStyle = fg; x.fill();
    x.fillStyle = 'rgba(255,255,255,.95)'; x.beginPath(); x.ellipse(k.x + sway * .3, fy - fh * .3, fw * .22, fh * .2, 0, 0, 6.283); x.fill();

    const s = Math.pow(Math.max(0, Math.sin(t * .0023 + k.ph * 3)), 8);
    if(s > .02){
      const L = 26 * dpr * s; x.strokeStyle = 'rgba(255,255,255,' + (.85 * s).toFixed(3) + ')'; x.lineWidth = dpr;
      x.beginPath(); x.moveTo(k.x + sway - L, cy); x.lineTo(k.x + sway + L, cy); x.moveTo(k.x + sway, cy - L); x.lineTo(k.x + sway, cy + L); x.stroke();
    }
  }

  function draw(t){
    x.clearRect(0, 0, W, H);
    for(const k of candles) candle(k, t);
    for(const m of motes){
      if(!reduce){ m.y -= m.v; if(m.y < -5) { m.y = H + 5; m.x = Math.random() * W; } }
      x.globalAlpha = Math.max(0, .12 + .5 * Math.sin(t * .002 + m.p));
      x.fillStyle = '#e8eeff'; x.beginPath(); x.arc(m.x + Math.sin(t * .0008 + m.p) * 8 * dpr, m.y, m.r, 0, 6.283); x.fill();
    }
    x.globalAlpha = 1;
  }

  function frame(t){ if(!run) return; draw(t); requestAnimationFrame(frame); }
  addEventListener('resize', size);
  if(!reduce) document.addEventListener('visibilitychange', () => { run = !document.hidden; if(run) requestAnimationFrame(frame); });
  size();
  if(!reduce) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
